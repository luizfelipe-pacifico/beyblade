# Integração contínua (docs/CI.md): testes em Linux e Windows, build do jogo e da landing e auditoria.
# A ROM do GBA não existe na CI (D-007): os testes usam ROM sintética e o jogo builda sem public/rom.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # O Prisma gera o client no postinstall; a CI não abre conexão com o banco.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows é a plataforma do .exe (D-004); Linux pega diferenças de caminho e de maiúsculas.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gerar dados das beys e arte (scripts/sync-art.js)
        run: node scripts/sync-art.js
      - run: npm test

  build-game:
    name: Build do jogo (Next.js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-art.js
      - name: next build
        run: npx next build

  build-site:
    name: Build da landing (site/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    # Informativo por enquanto: um alerta novo de terceiro não deve travar o desenvolvimento do dia.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (jogo)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (landing)
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
