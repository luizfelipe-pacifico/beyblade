# Banco do jogo: PostgreSQL em container (ver docs/DATABASE.md).
# Suba com `npm run db:up`. As variáveis vêm do .env (copie de .env.example).
name: beyblade

services:
  db:
    image: postgres:18-alpine
    container_name: beyblade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beyblade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-beyblade}
    # Só na interface local: o banco nunca fica exposto na rede.
    # 5434 no host porque 5432/5433 costumam estar ocupadas por outros Postgres.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    # A partir do Postgres 18 o volume é montado em /var/lib/postgresql (não mais em /data).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
